name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name WifiManager --exclude-module unittest --exclude-module pydoc wifi_manager.py
      - uses: actions/upload-artifact@v4
        with:
          name: WifiManager
          path: dist/WifiManager.exe
